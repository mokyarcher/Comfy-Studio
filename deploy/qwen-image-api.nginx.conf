# Unfiled domains on port 80/443 get Tencent ICP interstitial.
# Reuse already-open port 8080 (same as llm.sharex.my), distinguished by Host.

server {
    listen 80;
    server_name qwen-image-2-1.sharex.my;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 200 'Use http://qwen-image-2-1.sharex.my:8080 (port 80 blocked without ICP filing)\n';
        add_header Content-Type text/plain;
    }
}

server {
    listen 8080;
    server_name qwen-image-2-1.sharex.my;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
