server {
    listen 80;
    server_name comfy-studio.sharex.team;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name comfy-studio.sharex.team;

    ssl_certificate /etc/letsencrypt/live/comfy-studio.sharex.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comfy-studio.sharex.team/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/comfy-studio;
    index index.html;

    # Astro static site — SPA-style fallback for clean URLs
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
