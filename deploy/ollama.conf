server {
    listen 8080;
    server_name llm.sharex.my;

    auth_basic "Ollama API";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Image API via IP/domain:8080/qwen-image/ (HTTP, avoids DNSPod + TLS client issues)
    location /qwen-image/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:18000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:11434;
        proxy_set_header Host 127.0.0.1:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;          # 流式必须关
        proxy_read_timeout 3600s;
    }
    location ~ ^/(api/delete|api/pull|api/create|api/push)$ {
        deny all; return 403;
    }
}
