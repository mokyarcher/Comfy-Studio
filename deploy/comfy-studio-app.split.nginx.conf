# Web Studio SPA with split backends (cloud meta + GPU FRP)
# Static: /var/www/comfy-studio-app
# Meta data plane (cloud): 127.0.0.1:8101  ENABLE_GENERATION=false INSTANCE_ID=…
# GPU generate plane (FRP): 127.0.0.1:18000

upstream comfy_meta {
    server 127.0.0.1:8101;
}

upstream comfy_gpu {
    server 127.0.0.1:18000;
}

server {
    listen 80;
    server_name app.comfy-studio.sharex.team;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.comfy-studio.sharex.team;

    # ssl_certificate /etc/letsencrypt/live/app.comfy-studio.sharex.team/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.comfy-studio.sharex.team/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 64m;

    root /var/www/comfy-studio-app;
    index index.html;

    # --- Generation (GPU via FRP) ---
    location ^~ /v1/images/ {
        proxy_pass http://comfy_gpu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /v1/tasks/ {
        proxy_pass http://comfy_gpu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /v1/admin/host-services {
        proxy_pass http://comfy_gpu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /v1/system/gpu {
        proxy_pass http://comfy_gpu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Meta data plane (cloud instance store) ---
    location /v1/ {
        proxy_pass http://comfy_meta;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health/ {
        proxy_pass http://comfy_meta;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
