# Web Studio SPA — app.comfy-studio.sharex.team
# Static files: /var/www/comfy-studio-app
# Same-origin proxy for /v1 and /health → FastAPI (via FRP local port, adjust as needed)

server {
    listen 80;
    server_name app.comfy-studio.sharex.team;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.comfy-studio.sharex.team;

    # ssl_certificate /etc/letsencrypt/live/app.comfy-studio.sharex.team/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.comfy-studio.sharex.team/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Align with API MAX_UPLOAD_BYTES (15MB) + multipart overhead
    client_max_body_size 16m;

    root /var/www/comfy-studio-app;
    index index.html;

    location /health/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
