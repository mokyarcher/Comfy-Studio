# Gateway Admin SPA — https://comfy-gateway.sharex.team
# Static: /var/www/comfy-gateway-admin
#
# Split backends (same INSTANCE_ID as Studio):
#   Meta  127.0.0.1:8101 — users / auth / stats / prompts / showcase（注册申请权威库）
#   GPU   127.0.0.1:18000 — host-services / local-hold / system（本机启停与占用）

upstream comfy_gateway_meta {
    server 127.0.0.1:8101;
}

upstream comfy_gateway_gpu {
    server 127.0.0.1:18000;
}

server {
    listen 80;
    server_name comfy-gateway.sharex.team;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name comfy-gateway.sharex.team;

    ssl_certificate /etc/letsencrypt/live/comfy-gateway.sharex.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comfy-gateway.sharex.team/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m;

    root /var/www/comfy-gateway-admin;
    index index.html;

    # --- GPU plane (local machine via FRP) ---
    location ^~ /v1/admin/host-services {
        proxy_pass http://comfy_gateway_gpu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /v1/admin/local-hold {
        proxy_pass http://comfy_gateway_gpu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /v1/system/ {
        proxy_pass http://comfy_gateway_gpu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Generation-plane health (API + FRP up?)
    location /health/ {
        proxy_pass http://comfy_gateway_gpu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- Meta data plane (users / register / approve) ---
    location /v1/ {
        proxy_pass http://comfy_gateway_meta;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
