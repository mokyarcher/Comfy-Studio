appId: com.sharex.comfy.gateway
productName: Comfy Gateway
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: resources/tray-16.png
    to: tray-16.png
  - from: resources/icon.png
    to: icon.png
win:
  icon: icon.png
  # NSIS/portable 需在线下载工具；当前网络受限时用 dir（解压即用）
  target:
    - target: dir
      arch:
        - x64
  artifactName: Comfy-Gateway-${version}-${arch}.${ext}
