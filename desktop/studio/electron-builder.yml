appId: com.sharex.comfy.studio
productName: Comfy Studio
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon-32.png
    to: icon-32.png
win:
  icon: icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: Comfy-Studio-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Comfy Studio
portable:
  artifactName: Comfy-Studio-Portable-${version}.${ext}
