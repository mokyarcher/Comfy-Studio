appId: com.sharex.comfy.studio
productName: Comfy Studio
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon-32.png
    to: icon-32.png
win:
  icon: icon.png
  # 避免 winCodeSign 解压需管理员符号链接权限
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Comfy-Studio-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Comfy Studio
  installerLanguages:
    - zh_CN
    - en_US
  language: 2052
  deleteAppDataOnUninstall: false
